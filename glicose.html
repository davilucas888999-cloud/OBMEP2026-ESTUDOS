<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Glicose Fácil</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #27ae60;
            --bg-light: #f9f9f9;
            --bg-dark: #ecf0f1;
            --text-color: #333;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            font-size: 20px; /* Fonte maior para idosos */
        }

        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        h1, h2 {
            text-align: center;
            color: var(--primary-color);
        }

        .section {
            margin-bottom: 30px;
            padding: 20px;
            border: 2px solid #ddd;
            border-radius: 10px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input, select, textarea {
            width: 100%;
            padding: 15px;
            margin-bottom: 20px;
            border: 2px solid #ccc;
            border-radius: 8px;
            font-size: 18px;
            box-sizing: border-box; /* Garante que o padding não estoure a largura */
        }

        button {
            width: 100%;
            padding: 20px;
            font-size: 22px;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
            margin-bottom: 10px;
        }

        .btn-save { background-color: var(--accent-color); }
        .btn-save:hover { background-color: #219150; }

        .btn-pdf { background-color: #2980b9; }
        .btn-pdf:hover { background-color: #1f6391; }

        .btn-delete { background-color: #c0392b; font-size: 16px; padding: 10px; width: auto; }

        /* Estilo da Tabela de Registros */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th {
            background-color: var(--primary-color);
            color: white;
            padding: 15px;
            text-align: left;
        }

        td {
            padding: 15px;
            text-align: left;
        }

        /* Cores intercaladas sem bordas */
        tr:nth-child(even) { background-color: var(--bg-light); }
        tr:nth-child(odd) { background-color: var(--bg-dark); }

        /* Estilo para o PDF (oculto na tela) */
        #pdf-content {
            display: none;
            padding: 40px;
        }

        .export-group {
            display: flex;
            gap: 10px;
        }

        @media (max-width: 600px) {
            body { padding: 10px; }
            .export-group { flex-direction: column; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🩸 Controle de Glicose</h1>

    <div class="section">
        <h2>Dados do Paciente</h2>
        <label>Nome Completo:</label>
        <input type="text" id="pacienteNome" placeholder="Ex: João da Silva" oninput="salvarCadastro()">
        
        <label>Endereço Completo:</label>
        <input type="text" id="pacienteEndereco" placeholder="Rua, Número, Bairro, Cidade" oninput="salvarCadastro()">
    </div>

    <div class="section">
        <h2>Novo Registro</h2>
        <label>Data:</label>
        <input type="date" id="regData">
        
        <label>Horário:</label>
        <input type="time" id="regHora">

        <label>Parte do Dia:</label>
        <select id="regPeriodo">
            <option value="Manhã">Manhã</option>
            <option value="Noite">Noite</option>
        </select>

        <label>Valor da Glicose (mg/dL):</label>
        <input type="number" id="regValor" placeholder="Ex: 110">

        <label>Quem mediu?</label>
        <input type="text" id="regResponsavel" placeholder="Ex: Paciente, Filho(a), Enfermeira">

        <label>Observações:</label>
        <textarea id="regObs" rows="2" placeholder="Ex: Medido após o café"></textarea>

        <button class="btn-save" onclick="adicionarRegistro()">SALVAR MEDIÇÃO</button>
    </div>

    <div class="section">
        <h2>Exportar Relatório Mensal</h2>
        <div class="export-group">
            <select id="filtroMes">
                <option value="01">Janeiro</option>
                <option value="02">Fevereiro</option>
                <option value="03">Março</option>
                <option value="04">Abril</option>
                <option value="05">Maio</option>
                <option value="06">Junho</option>
                <option value="07">Julho</option>
                <option value="08">Agosto</option>
                <option value="09">Setembro</option>
                <option value="10">Outubro</option>
                <option value="11">Novembro</option>
                <option value="12">Dezembro</option>
            </select>
            <input type="number" id="filtroAno" value="2024">
        </div>
        <button class="btn-pdf" onclick="gerarPDF()">GERAR PDF PARA O MÉDICO</button>
    </div>

    <h2>Histórico de Medições</h2>
    <div style="overflow-x: auto;">
        <table>
            <thead>
                <tr>
                    <th>Data/Hora</th>
                    <th>Valor</th>
                    <th>Período</th>
                    <th>Ação</th>
                </tr>
            </thead>
            <tbody id="tabelaCorpo">
                </tbody>
        </table>
    </div>
</div>

<div id="pdf-area" style="display: none; font-family: sans-serif;">
    <h1 style="text-align: center;">Relatório de Glicemia</h1>
    <hr>
    <p><strong>Paciente:</strong> <span id="pdfNome"></span></p>
    <p><strong>Endereço:</strong> <span id="pdfEndereco"></span></p>
    <p><strong>Mês de Referência:</strong> <span id="pdfMesAno"></span></p>
    <br>
    <table style="width: 100%; border-collapse: collapse;">
        <thead>
            <tr style="background-color: #2c3e50; color: white;">
                <th style="padding: 10px;">Data</th>
                <th style="padding: 10px;">Hora</th>
                <th style="padding: 10px;">Período</th>
                <th style="padding: 10px;">Valor</th>
                <th style="padding: 10px;">Responsável</th>
            </tr>
        </thead>
        <tbody id="pdfTabelaCorpo"></tbody>
    </table>
</div>

<script>
    // Inicialização
    document.addEventListener('DOMContentLoaded', () => {
        carregarCadastro();
        carregarRegistros();
        
        // Define data e hora atual como padrão
        const agora = new Date();
        document.getElementById('regData').valueAsDate = agora;
        document.getElementById('regHora').value = agora.getHours().toString().padStart(2, '0') + ":" + agora.getMinutes().toString().padStart(2, '0');
        document.getElementById('filtroAno').value = agora.getFullYear();
        document.getElementById('filtroMes').value = (agora.getMonth() + 1).toString().padStart(2, '0');
    });

    // Funções de Cadastro do Paciente
    function salvarCadastro() {
        localStorage.setItem('pacienteNome', document.getElementById('pacienteNome').value);
        localStorage.setItem('pacienteEndereco', document.getElementById('pacienteEndereco').value);
    }

    function carregarCadastro() {
        document.getElementById('pacienteNome').value = localStorage.getItem('pacienteNome') || "";
        document.getElementById('pacienteEndereco').value = localStorage.getItem('pacienteEndereco') || "";
    }

    // Funções de Registros
    function adicionarRegistro() {
        const data = document.getElementById('regData').value;
        const hora = document.getElementById('regHora').value;
        const periodo = document.getElementById('regPeriodo').value;
        const valor = document.getElementById('regValor').value;
        const responsavel = document.getElementById('regResponsavel').value;
        const obs = document.getElementById('regObs').value;

        if(!data || !valor) {
            alert("Por favor, preencha a data e o valor da glicose.");
            return;
        }

        const registro = {
            id: Date.now(),
            data,
            hora,
            periodo,
            valor,
            responsavel,
            obs
        };

        let registros = JSON.parse(localStorage.getItem('glicoseData')) || [];
        registros.push(registro);
        
        // Ordenar por data
        registros.sort((a, b) => new Date(b.data + 'T' + b.hora) - new Date(a.data + 'T' + a.hora));
        
        localStorage.setItem('glicoseData', JSON.stringify(registros));
        
        // Limpar campos de valor
        document.getElementById('regValor').value = "";
        document.getElementById('regObs').value = "";
        
        carregarRegistros();
    }

    function carregarRegistros() {
        const registros = JSON.parse(localStorage.getItem('glicoseData')) || [];
        const tabela = document.getElementById('tabelaCorpo');
        tabela.innerHTML = "";

        registros.forEach(reg => {
            const dataFormatada = reg.data.split('-').reverse().join('/');
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${dataFormatada}<br><small>${reg.hora}</small></td>
                <td><strong>${reg.valor} mg/dL</strong></td>
                <td>${reg.periodo}</td>
                <td><button class="btn-delete" onclick="deletarRegistro(${reg.id})">Excluir</button></td>
            `;
            tabela.appendChild(row);
        });
    }

    function deletarRegistro(id) {
        if(confirm("Deseja realmente apagar este registro?")) {
            let registros = JSON.parse(localStorage.getItem('glicoseData')) || [];
            registros = registros.filter(r => r.id !== id);
            localStorage.setItem('glicoseData', JSON.stringify(registros));
            carregarRegistros();
        }
    }

    // Função de Exportação PDF
    function gerarPDF() {
        const mesFiltro = document.getElementById('filtroMes').value;
        const anoFiltro = document.getElementById('filtroAno').value;
        const registros = JSON.parse(localStorage.getItem('glicoseData')) || [];

        // Filtrar registros
        const filtrados = registros.filter(r => {
            const dataPartes = r.data.split('-'); // [ano, mes, dia]
            return dataPartes[0] === anoFiltro && dataPartes[1] === mesFiltro;
        });

        if(filtrados.length === 0) {
            alert("Nenhum registro encontrado para este mês e ano.");
            return;
        }

        // Preencher área do PDF
        document.getElementById('pdfNome').innerText = localStorage.getItem('pacienteNome') || "Não informado";
        document.getElementById('pdfEndereco').innerText = localStorage.getItem('pacienteEndereco') || "Não informado";
        document.getElementById('pdfMesAno').innerText = `${mesFiltro}/${anoFiltro}`;

        const pdfTabela = document.getElementById('pdfTabelaCorpo');
        pdfTabela.innerHTML = "";

        filtrados.reverse().forEach((reg, index) => {
            const row = document.createElement('tr');
            // Intercalação de cores manual para o PDF
            row.style.backgroundColor = (index % 2 === 0) ? "#f2f2f2" : "#ffffff";
            
            row.innerHTML = `
                <td style="padding: 10px;">${reg.data.split('-').reverse().join('/')}</td>
                <td style="padding: 10px;">${reg.hora}</td>
                <td style="padding: 10px;">${reg.periodo}</td>
                <td style="padding: 10px;"><strong>${reg.valor} mg/dL</strong></td>
                <td style="padding: 10px;">${reg.responsavel}</td>
            `;
            pdfTabela.appendChild(row);
        });

        // Configurações do PDF
        const elemento = document.getElementById('pdf-area');
        elemento.style.display = 'block'; // Mostra temporariamente para capturar

        const opt = {
            margin:       15,
            filename:     `Glicose_${mesFiltro}_${anoFiltro}.pdf`,
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: 2 },
            jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };

        html2pdf().set(opt).from(elemento).save().then(() => {
            elemento.style.display = 'none'; // Esconde novamente
        });
    }
</script>

</body>
</html>
